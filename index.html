<!DOCTYPE html>
<html>
<head>
    <title>Shop-Book Record</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Shop-Book Record</h1>
    <p>Simple Business Management</p>
</header>

<main class="container">

    <section class="dashboard">
    
    <div class="card sales">
    <h3>Total Sales</h3>
    <strong id="totalSales">₦0</strong>
        </div>

    <div class="card expenses">
        <h3>Total Expenses</h3>
    <strong id="totalExpenses">₦0
        </strong>
    </div>

    <div class="card profit">
        <h3>Profit</h3>
    <strong id="totalProfit">₦0</strong>
        </div>

    <div class="card credit">
        <h3>Outstanding Credit</h3>
    <strong id="totalCredit">₦0</strong>
        </div>

    </section>

    <section class="form-section">

        <h2>Add Record</h2>
  
    <div class="form-grid">

    <input
        type="date"
        id="date"
        >

    <input
        type="text"
        id="description"
        placeholder="What happened?"
            >
            
    <select id="type">
    <option value="sale">Sale</option>
    <option value="expense">Expense</option>
    <option value="credit">Credit Given</option>
    <option value="credit_payment">Credit Payment</option>
            </select>

    <input
        type="number"
        id="amount"
        placeholder="Amount ₦"
        min="0"
            >

        </div>

        <button
            type="button"
            class="add-btn"
            onclick="addRecord()"
        >
            + Save Record
        </button>

    </section>

    <section class="filter-section">

    <h2>Records</h2>

    <input
        type="search"
        id="search"
        placeholder="Search records...">

    <div class="period-buttons">

    <button
        type="button"
        id="dailyBtn"
            >
        Daily
    </button>

    <button
        type="button"
        id="weeklyBtn"
            >
       Weekly
        </button>

    <button
        type="button"
        id="monthlyBtn"
            >
        Monthly
        </button>

    <button
        type="button"
        id="yearlyBtn"
        >
        Yearly
        </button>

        </div>

    </section>

    <section class="table-section">

    <h2 id="recordTitle">Daily  
        Records</h2>
        
    <div class="record-actions">

    <button
        type="button"
        onclick="saveResult()"
        >
        Save Result
        </button>
        
    <button
        type="button"
        onclick="downloadPDF()"
        >
        Download PDF 
          </button>
        
     <button
         type="button"
         onclick="clearAll()"
         >
         Clear All
     </button>
     
    </div>
    <br>
    <div class="table-container">
 
    <table>
      <thead>
    <tr>
      <th>Date</th>
       <th>Description</th>
    </th>
      <th>Type</th>
      <th>Amount</th>
      <th>Action</th>
    </tr>
    </thead>

      <tbody id="recordTable">
    </tbody>
    </table>
    </div>
    </section>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
